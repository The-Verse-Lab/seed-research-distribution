"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "bun run setup"
run_mode = "concurrent"

[scripts.run.viewer]
available_in = [ "local" ]
command = "SEED_VIEWER_PORT=$CONDUCTOR_PORT bun run viewer"
default = true
icon = "monitor"

[scripts.run.test]
command = "bun test --watch"
icon = "test-tube"

[scripts.run.check]
command = "bun run check"
icon = "wrench"
